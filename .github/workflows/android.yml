name: Build Ludo Nex Android APK

on:
  push:
    branches:
      - main
      - setup/godot-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Export Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Download Godot 4.7.2 and export templates
        run: |
          mkdir -p /tmp/godot /tmp/godot-templates
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" \
            -o /tmp/godot-templates/templates.tpz
          unzip -q /tmp/godot-templates/templates.tpz -d /tmp/godot-templates/unpacked
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -a /tmp/godot-templates/unpacked/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          printf "4.7.2.stable" > "$HOME/.local/share/godot/export_templates/4.7.2.stable/version.txt"

      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot" build
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          keytool -genkeypair -v \
            -keystore build/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Validate project scripts
        run: |
          Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --import
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 3

      - name: Export debug APK
        run: |
          mkdir -p build
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-debug "Android" build/LudoNex.apk
          test -s build/LudoNex.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-Nex-Android-APK
          path: build/LudoNex.apk
          if-no-files-found: error
          retention-days: 14
