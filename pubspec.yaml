name: ludo_nex
description: Ludo Nex — um jogo de tabuleiro 3D original para Android.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_scene: ^0.24.3
  hooks: ^2.2.0
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - flutter_scene_generated/
